<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestra Boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  body { position: relative; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 70px 20px 56px;
    overflow: hidden;
  }
  .hero-ornament {
    width: min(90vw, 380px);
    height: auto;
    color: var(--moss);
    opacity: 0.55;
    margin: 0 auto 8px;
  }
  .kicker {
    font-family: var(--sans);
    font-size: 0.82rem;
    letter-spacing: 0.28em;
    color: var(--moss);
    margin: 0 0 10px;
  }
  .couple-names {
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    color: var(--forest-deep);
    line-height: 1.15;
    margin: 0 0 14px;
  }
  .couple-names .amp { font-family: var(--serif); font-style: italic; font-size: 0.6em; color: var(--gold); padding: 0 6px; }
  .hero-date {
    font-family: var(--sans);
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 0 0 22px;
  }
  .hero-welcome {
    max-width: 480px;
    margin: 0 auto 30px;
    color: var(--ink);
    font-size: 1.12rem;
  }

  /* ---------- Cuenta regresiva ---------- */
  .countdown-label {
    font-family: var(--sans);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .countdown {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 34px;
    flex-wrap: wrap;
  }
  .cd-box {
    background: var(--white);
    border: 1px solid var(--sage-light);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    min-width: 66px;
    box-shadow: var(--shadow-soft);
  }
  .cd-box strong { display: block; font-family: var(--serif); font-size: 1.7rem; color: var(--forest); }
  .cd-box span { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }

  /* ---------- Secciones de evento ---------- */
  .section { position: relative; z-index: 1; padding: 20px 20px 56px; }
  .section-title {
    text-align: center;
    font-size: clamp(1.7rem, 5vw, 2.2rem);
    color: var(--forest-deep);
    margin-bottom: 6px;
  }
  .section-title-wrap { text-align: center; margin-bottom: 26px; }

  .event-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 620px) {
    .event-grid { grid-template-columns: 1fr 1fr; }
  }
  .event-card { text-align: center; }
  .event-card .leaf-icon { width: 30px; height: 30px; color: var(--gold); margin-bottom: 10px; }
  .event-card h3 { font-size: 1.4rem; color: var(--forest); margin-bottom: 4px; }
  .event-card .event-time { font-family: var(--sans); font-size: 0.88rem; color: var(--moss); margin-bottom: 12px; }
  .event-card p { margin: 0 0 4px; color: var(--ink); }
  .event-card a.maps-link {
    display: inline-block;
    margin-top: 10px;
    font-family: var(--sans);
    font-size: 0.82rem;
    color: var(--forest);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .dress-code { text-align: center; max-width: 480px; margin: 0 auto; }
  .dress-code h3 { color: var(--forest); font-size: 1.3rem; margin-bottom: 8px; }

  /* ---------- Footer ---------- */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 20px 60px;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.85rem;
  }
  footer .signature { font-family: var(--script); font-size: 1.8rem; color: var(--forest); margin-top: 8px; }
</style>
</head>
<body>

<div class="leaves-bg" id="leaves-bg" aria-hidden="true"></div>

<nav class="site-nav">
  <a href="#inicio" id="nav-home"></a>
  <a href="#ceremonia" id="nav-ceremony"></a>
  <a href="#recepcion" id="nav-reception"></a>
  <a href="confirmar.html" id="nav-rsvp"></a>
  <a href="regalos.html" id="nav-wishlist"></a>
  <a href="fotos.html" id="nav-photos"></a>
</nav>

<header class="hero" id="inicio">
  <svg class="hero-ornament" viewBox="0 0 300 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 30 C 60 5, 110 5, 150 30 C 190 55, 240 55, 290 30" stroke="currentColor" stroke-width="1.4"/>
    <g stroke="currentColor" stroke-width="1.2" fill="currentColor">
      <path d="M50 20 C 44 12, 34 12, 30 20 C 34 28, 44 28, 50 20 Z" fill-opacity="0.18"/>
      <path d="M150 8 C 144 0, 134 0, 130 8 C 134 16, 144 16, 150 8 Z" fill-opacity="0.18"/>
      <path d="M250 20 C 244 12, 234 12, 230 20 C 234 28, 244 28, 250 20 Z" fill-opacity="0.18"/>
    </g>
  </svg>
  <p class="kicker" id="txt-kicker"></p>
  <h1 class="couple-names"><span id="txt-partner1"></span><span class="amp">&amp;</span><span id="txt-partner2"></span></h1>
  <p class="hero-date" id="txt-date-display"></p>
  <p class="hero-welcome" id="txt-welcome"></p>

  <p class="countdown-label" id="txt-countdown-label"></p>
  <div class="countdown" id="countdown">
    <div class="cd-box"><strong id="cd-days">00</strong><span id="cd-days-label"></span></div>
    <div class="cd-box"><strong id="cd-hours">00</strong><span id="cd-hours-label"></span></div>
    <div class="cd-box"><strong id="cd-minutes">00</strong><span id="cd-minutes-label"></span></div>
    <div class="cd-box"><strong id="cd-seconds">00</strong><span id="cd-seconds-label"></span></div>
  </div>

  <a href="confirmar.html" class="btn btn-primary" id="txt-cta"></a>
</header>

<section class="section reveal" id="ceremonia">
  <div class="section-title-wrap">
    <h2 class="section-title" id="txt-section-ceremony"></h2>
    <div class="divider"><svg class="leaf-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 6 4 11 4 15a8 8 0 0016 0c0-4-3-9-8-13z"/></svg></div>
  </div>
  <div class="event-grid">
    <div class="card event-card">
      <svg class="leaf-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 6 4 11 4 15a8 8 0 0016 0c0-4-3-9-8-13z"/></svg>
      <h3 id="cer-title"></h3>
      <p class="event-time" id="cer-time"></p>
      <p id="cer-place"></p>
      <p id="cer-address"></p>
      <a class="maps-link" id="cer-maps" href="#" target="_blank" rel="noopener">Ver en el mapa →</a>
    </div>
    <div class="card event-card">
      <svg class="leaf-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C7 6 4 11 4 15a8 8 0 0016 0c0-4-3-9-8-13z"/></svg>
      <h3 id="rec-title"></h3>
      <p class="event-time" id="rec-time"></p>
      <p id="rec-place"></p>
      <p id="rec-address"></p>
      <a class="maps-link" id="rec-maps" href="#" target="_blank" rel="noopener">Ver en el mapa →</a>
    </div>
  </div>
</section>

<section class="section reveal dress-code" id="recepcion">
  <h3 id="dress-title"></h3>
  <p id="dress-text"></p>
</section>

<footer>
  <p id="txt-footer-thanks"></p>
  <p class="signature" id="txt-footer-signature"></p>
</footer>

<script src="content.js"></script>
<script>
(function () {
  'use strict';

  const C = CONTENT;
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------
  // Texto: aplica todo el contenido de content.js al DOM
  // ---------------------------------------------------------
  function applyContent() {
    document.title = C.siteTitle;

    $('nav-home').textContent = C.nav.home;
    $('nav-ceremony').textContent = C.nav.ceremony;
    $('nav-reception').textContent = C.nav.reception;
    $('nav-rsvp').textContent = C.nav.rsvp;
    $('nav-wishlist').textContent = C.nav.wishlist;
    $('nav-photos').textContent = C.nav.photos;

    $('txt-kicker').textContent = C.hero.kicker;
    $('txt-partner1').textContent = C.couple.partner1;
    $('txt-partner2').textContent = C.couple.partner2;
    $('txt-date-display').textContent = C.hero.dateDisplay;
    $('txt-welcome').textContent = C.hero.welcome;
    $('txt-cta').textContent = C.hero.ctaButton;

    $('txt-countdown-label').textContent = C.countdown.label;
    $('cd-days-label').textContent = C.countdown.days;
    $('cd-hours-label').textContent = C.countdown.hours;
    $('cd-minutes-label').textContent = C.countdown.minutes;
    $('cd-seconds-label').textContent = C.countdown.seconds;

    $('txt-section-ceremony').textContent = C.nav.ceremony + ' & ' + C.nav.reception;

    $('cer-title').textContent = C.ceremony.title;
    $('cer-time').textContent = C.ceremony.time;
    $('cer-place').textContent = C.ceremony.place;
    $('cer-address').textContent = C.ceremony.address;
    $('cer-maps').href = C.ceremony.mapsUrl;

    $('rec-title').textContent = C.reception.title;
    $('rec-time').textContent = C.reception.time;
    $('rec-place').textContent = C.reception.place;
    $('rec-address').textContent = C.reception.address;
    $('rec-maps').href = C.reception.mapsUrl;

    $('dress-title').textContent = C.dressCode.title;
    $('dress-text').textContent = C.dressCode.text;

    $('txt-footer-thanks').textContent = C.footer.thanks;
    $('txt-footer-signature').textContent = C.footer.signature;
  }

  // ---------------------------------------------------------
  // Hojas flotantes decorativas
  // ---------------------------------------------------------
  function spawnLeaves() {
    const host = $('leaves-bg');
    const total = 9;
    for (let i = 0; i < total; i++) {
      const size = 14 + (i % 4) * 6;
      const left = (i * 97) % 100;
      const duration = 14 + (i % 5) * 4;
      const delay = -(i * 3.4);
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'currentColor');
      svg.classList.add('leaf-float');
      svg.style.left = left + '%';
      svg.style.width = size + 'px';
      svg.style.height = size + 'px';
      svg.style.animationDuration = duration + 's';
      svg.style.animationDelay = delay + 's';
      svg.innerHTML = '<path d="M12 2C7 6 4 11 4 15a8 8 0 0016 0c0-4-3-9-8-13z"/>';
      host.appendChild(svg);
    }
  }

  // ---------------------------------------------------------
  // Cuenta regresiva
  // ---------------------------------------------------------
  function startCountdown() {
    const target = new Date(C.eventDateISO).getTime();
    function tick() {
      const diff = target - Date.now();
      if (isNaN(target)) return;
      if (diff <= 0) {
        $('countdown').innerHTML = '<p style="font-family:var(--sans);color:var(--forest);">' + C.countdown.todayMessage + '</p>';
        clearInterval(timer);
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      $('cd-days').textContent = String(d).padStart(2, '0');
      $('cd-hours').textContent = String(h).padStart(2, '0');
      $('cd-minutes').textContent = String(m).padStart(2, '0');
      $('cd-seconds').textContent = String(s).padStart(2, '0');
    }
    tick();
    const timer = setInterval(tick, 1000);
  }

  // ---------------------------------------------------------
  // Revelado al hacer scroll
  // ---------------------------------------------------------
  function startRevealObserver() {
    const items = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      items.forEach((el) => el.classList.add('in-view'));
      return;
    }
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    items.forEach((el) => obs.observe(el));
  }

  // ---------------------------------------------------------
  // Arranque
  // ---------------------------------------------------------
  document.addEventListener('DOMContentLoaded', () => {
    applyContent();
    spawnLeaves();
    startCountdown();
    startRevealObserver();
  });
})();
</script>
</body>
</html>
